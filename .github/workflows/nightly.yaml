name: JuliaNightly
# The pipeline tests on Julia nightly, weekly, on every push to main and on
# request, so that a coming Julia breakage is seen before it is released

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * 0'  # Weekly at 2 AM UTC Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-tests:
    uses: ./.github/workflows/pipeline-tests.yaml
    with:
      julia-version: nightly
      os: ubuntu-latest
      experimental: true
    secrets: inherit
