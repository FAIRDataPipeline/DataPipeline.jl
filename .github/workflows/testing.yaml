name: CI

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-tests:
    strategy:
      matrix:
        julia-version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
      fail-fast: false
    uses: ./.github/workflows/pipeline-tests.yaml
    with:
      julia-version: ${{ matrix.julia-version }}
      os: ${{ matrix.os }}
      # One job builds papers; the others skip those tests
      tex: ${{ matrix.os == 'ubuntu-latest' && matrix.julia-version == '1' }}
    secrets: inherit
