name: Fair harness

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  fair-harness:
    name: Pkg.test --fair - ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install fair-cli
        # `fair` on the path, as a user installs it; the harness installs the
        # registry itself
        run: python -m pip install fair-cli
        shell: bash
      - name: Running the harness
        # `--fair` builds the tests' own pipeline, and the one file it runs
        # there checks the pipeline rather than the package
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args = ["--fair", "fair_harness.jl"])'
        shell: bash
